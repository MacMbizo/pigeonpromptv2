name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  analyze:
    if: ${{ hashFiles('**/*.{js,jsx,ts,tsx}') != '' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      # For JavaScript/TypeScript, a build step is not required for CodeQL analysis.
      # Removing autobuild avoids unnecessary failures in projects using pnpm or without a lockfile.
      - uses: github/codeql-action/analyze@v3